services:
  analyzer:
    build: .
    init: true
    restart: unless-stopped
    environment:
      TENANT_ID: ${TENANT_ID:-9070ef23-9a31-45a8-9b14-45111a4ebbbe}
      CLIENT_ID: ${CLIENT_ID:-3e16daef-f2ac-4761-86eb-2d80e04d9a7a}
      CLIENT_SECRET: ${CLIENT_SECRET:?Set CLIENT_SECRET in your local .env}
      MAILBOX: ${MAILBOX:-phishing@rededucation.com}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-26214400}
      DATA_DIR: /data
      AUTO_REPLY_MODE: ${AUTO_REPLY_MODE:-preview}
      ESCALATION_EMAIL: ${ESCALATION_EMAIL:-security@rededucation.com}
      REPORTER_DOMAINS: ${REPORTER_DOMAINS:-rededucation.com}
      REPLIES_PER_HOUR: ${REPLIES_PER_HOUR:-10}
    volumes:
      - analyzer-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  analyzer-data:
